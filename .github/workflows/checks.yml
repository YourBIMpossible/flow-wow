# Static checks on each integrated candidate: the same lint a contributor
# runs before committing (tools/lint.ps1: luacheck with .luacheckrc, texture
# paths, game globals in tests, functions defined twice, close buttons), plus
# tools/check-structure.ps1 (Flow.toc lists every file and only real ones; no
# registration key used twice). Passing this is not a gameplay test: the
# add-on's self-tests run in the game; tools/run-tests.ps1 runs the ones that
# need nothing of the game client (docs/TESTING.md). The Z-Flow steps at the
# end do the same for ZFlow/.
name: Checks

# One remote verification path: a push of an integrated candidate to zflow or
# main. Worker branches are verified locally by their author (the same
# tools/*.ps1 steps below) and handed off by exact SHA; the lead integrates
# them, verifies the batch locally, and pushes zflow once per candidate. There
# is no pull_request or workflow_dispatch trigger, so no worker branch, PR or
# hand-started run uses this workflow. A failed run is rerun (gh run rerun)
# only for an infrastructure fault such as a failed apt install or runner loss.
on:
  push:
    branches: [main, zflow]

permissions:
  contents: read

# A newer push to the same branch cancels the older run: the newer candidate
# contains it, so the older result would be obsolete before it finished.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reuse a result instead of repeating it: when this exact commit already
  # passed this workflow (for example main fast-forwarded to a zflow tip that
  # passed), the checks job is skipped and this job names the earlier run.
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      verified: ${{ steps.find.outputs.verified }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=$(gh api "repos/${{ github.repository }}/actions/workflows/checks.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].html_url // empty")
          if [ -n "$prior" ]; then
            echo "Commit ${{ github.sha }} already passed Checks: $prior"
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "No earlier passing Checks run for ${{ github.sha }}; running the checks."
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: reuse
    if: needs.reuse.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The game runs Lua 5.1; luacheck pinned to the version the maintainer
      # uses on Windows (1.2.0), so both report the same warnings.
      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0
          luacheck --version

      - name: Lint (tools/lint.ps1)
        shell: pwsh
        run: ./tools/lint.ps1

      - name: Structure (tools/check-structure.ps1)
        shell: pwsh
        run: ./tools/check-structure.ps1

      # Flow's registered tests on plain Lua 5.1 with fixture stubs
      # (tools/offline/stubs.lua). A test that touches anything of the game
      # client is a SKIP, never a PASS; a new FAIL or ERROR, a file that didn't load,
      # or a stale known name fails the job; tools/offline/known-failures.txt entries
      # are reported as known allowed.
      - name: Offline tests (tools/run-tests.ps1)
        shell: pwsh
        run: ./tools/run-tests.ps1

      # The Z-Flow line (ZFlow/): its own structure rules, its generated TOC
      # still matching manifest.lua, and its offline tests on the fake client.
      # Without these a broken Z-Flow commit shows green here. Only zflow and
      # main reach this workflow, so a stale TOC always fails.
      - name: Z-Flow structure (tools/zflow-structure.ps1)
        shell: pwsh
        run: ./tools/zflow-structure.ps1

      - name: Z-Flow TOC is current (tools/zflow-toc.ps1 -Check)
        shell: pwsh
        run: ./tools/zflow-toc.ps1 -Check

      - name: Z-Flow offline tests (tools/zflow-tests.ps1)
        shell: pwsh
        run: ./tools/zflow-tests.ps1
      - name: Z-Flow coverage (tools/zflow-coverage.ps1)
        shell: pwsh
        run: ./tools/zflow-coverage.ps1
      - name: Z-Flow settings lint (tools/zflow-settings-lint.ps1)
        shell: pwsh
        run: ./tools/zflow-settings-lint.ps1
      - name: Z-Flow player text (tools/zflow-text.ps1)
        shell: pwsh
        run: ./tools/zflow-text.ps1
