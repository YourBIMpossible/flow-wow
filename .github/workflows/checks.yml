# Static checks on every push and pull request: the same lint a contributor
# runs before committing (tools/lint.ps1: luacheck with .luacheckrc, texture
# paths, game globals in tests, functions defined twice, close buttons), plus
# tools/check-structure.ps1 (Flow.toc lists every file and only real ones; no
# registration key used twice). Passing this is not a gameplay test: the
# add-on's self-tests run in the game; tools/run-tests.ps1 runs the ones that
# need nothing of the game client (docs/TESTING.md). The Z-Flow steps at the
# end do the same for ZFlow/.
name: Checks

# Pushes run the checks only on the integration branches. Worker branches
# (zflow-<lane>-<item>) start with a tests-only red commit and leave the
# manifest and TOC lines to the lead, so they cannot pass on their own; the
# lead runs the full set on each delivered head before merging it. A worker
# branch can still be checked on demand with workflow_dispatch.
on:
  push:
    branches: [main, zflow]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The game runs Lua 5.1; luacheck pinned to the version the maintainer
      # uses on Windows (1.2.0), so both report the same warnings.
      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck 1.2.0
          luacheck --version

      - name: Lint (tools/lint.ps1)
        shell: pwsh
        run: ./tools/lint.ps1

      - name: Structure (tools/check-structure.ps1)
        shell: pwsh
        run: ./tools/check-structure.ps1

      # Flow's registered tests on plain Lua 5.1 with fixture stubs
      # (tools/offline/stubs.lua). A test that touches anything of the game
      # client is a SKIP, never a PASS; a new FAIL or ERROR, a file that didn't load,
      # or a stale known name fails the job; tools/offline/known-failures.txt entries
      # are reported as known allowed.
      - name: Offline tests (tools/run-tests.ps1)
        shell: pwsh
        run: ./tools/run-tests.ps1

      # The Z-Flow line (ZFlow/): its own structure rules, its generated TOC
      # still matching manifest.lua, and its offline tests on the fake client.
      # Without these a broken Z-Flow commit shows green here.
      - name: Z-Flow structure (tools/zflow-structure.ps1)
        shell: pwsh
        run: ./tools/zflow-structure.ps1

      - name: Z-Flow TOC is current (tools/zflow-toc.ps1 -Check)
        shell: pwsh
        run: ./tools/zflow-toc.ps1 -Check

      - name: Z-Flow offline tests (tools/zflow-tests.ps1)
        shell: pwsh
        run: ./tools/zflow-tests.ps1
